plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.compose)
    id("com.gradleup.nmcp")
}

android {
    namespace 'ar.imagin.KouraiKhryseai'
    compileSdk libs.versions.compileSdk.get().toInteger()

    resourcePrefix 'k_'

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "boolean", "LIBRARY_MODE", "true"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
        singleVariant('debug') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.google.material

    // Compose
    implementation(libs.androidx.activity.compose)
    implementation(libs.androidx.ui.tooling.preview)
    implementation(platform(libs.androidx.compose.bom))

    // Material
    implementation libs.androidx.material3
    api libs.androidx.material.icons.core

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

//.___ End of KouraiKhryseai lib build gradle __./

// Apply Maven publishing and signing for Maven Central
apply plugin: 'maven-publish'
apply plugin: 'signing'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // Coordinates
                groupId = 'io.github.josemg08'
                artifactId = 'kouraikhryseai'
                version = '1.0.0'

                // Tells Gradle to pull components from your release build variant
                def component = components.findByName('release')
                if (component != null) {
                    from component
                }

                // Required POM Metadata for Maven Central validation
                pom {
                    name = 'KouraiKhryseai'
                    description = 'Android Design System based in Material 3 and the golden ratio'
                    url = 'https://github.com/josemg08/KouraiKhryseai'

                    licenses {
                        license {
                            name = 'The MIT License'
                            url = 'https://github.com/josemg08/KouraiKhryseai?tab=MIT-1-ov-file#'
                        }
                    }
                    developers {
                        developer {
                            id = 'josemg08'
                            name = 'Jose M. Gonzalez'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/josemg08/KouraiKhryseai.git'
                        developerConnection = 'scm:git:git@github.com:josemg08/KouraiKhryseai.git'
                        url = 'https://github.com/josemg08/KouraiKhryseai'
                    }
                }
            }
        }
    }

    // Signs your artifacts using your local GPG setup
    signing {
        def signingKey = System.getenv("GPG_SIGNING_KEY")
        def signingPassword = System.getenv("GPG_PASSPHRASE")
        if (signingKey != null && signingPassword != null) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        } else {
            // Fallback to system GPG command
            useGpgCmd()
        }
        sign publishing.publications.release
    }

    nmcp {
        publish("release") {
            username = System.getenv("SONATYPE_USERNAME")
            password = System.getenv("SONATYPE_PASSWORD")
        }
    }
}
